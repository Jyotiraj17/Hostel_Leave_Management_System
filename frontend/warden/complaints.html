<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complaints Management - HMS</title>
  <link rel="stylesheet" href="../assets/css/hms-layout.css">
  <link rel="stylesheet" href="css/warden.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body data-page-title="Complaints">

  <div class="app-layout">
    <aside id="app-sidebar" class="sidebar"></aside>

    <div class="main-wrapper">
      <header id="app-topbar" class="topbar"></header>

      <main class="content-body">
        <div class="page-header" style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h1>Complaints Management</h1>
            <p>Track student complaints and update resolution status.</p>
          </div>

          <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
            <button class="btn btn-primary btn-sm complaint-filter-btn" data-status="ALL">All</button>
            <button class="btn btn-secondary btn-sm complaint-filter-btn" data-status="PENDING">Pending</button>
            <button class="btn btn-secondary btn-sm complaint-filter-btn" data-status="IN_PROGRESS">In Progress</button>
            <button class="btn btn-secondary btn-sm complaint-filter-btn" data-status="RESOLVED">Resolved</button>
            <button class="btn btn-secondary btn-sm complaint-filter-btn" data-status="REJECTED">Rejected</button>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title"><i data-lucide="alert-circle"></i> Student Complaints</div>
          </div>

          <div id="complaints-container">
            <div class="loading-spinner">
              <p>Loading complaints list...</p>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Update Complaint Status Modal -->
  <div id="update-complaint-modal" class="modal-backdrop">
    <div class="modal-content" style="max-width: 500px;">
      <div class="modal-header">
        <div class="modal-title">Update Complaint Status</div>
        <button class="modal-close" onclick="closeModal('update-complaint-modal')">&times;</button>
      </div>
      <form id="update-complaint-form">
        <input type="hidden" id="complaint-id" />
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="complaint-status-select">Status *</label>
            <select id="complaint-status-select" class="form-control" required>
              <option value="Pending">Pending</option>
              <option value="In Progress">In Progress</option>
              <option value="Resolved">Resolved</option>
              <option value="Rejected">Rejected</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="complaint-remarks-input">Warden Remarks / Resolution Notes</label>
            <textarea id="complaint-remarks-input" class="form-control" rows="3" placeholder="Enter remarks regarding this complaint..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('update-complaint-modal')">Cancel</button>
          <button type="submit" id="save-complaint-btn" class="btn btn-primary">Save Status</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../assets/js/modules/api.js"></script>
  <script src="../assets/js/modules/auth.js"></script>
  <script src="../assets/js/modules/sidebar.js"></script>
  <script src="../assets/js/modules/toast.js"></script>
  <script src="../assets/js/modules/validator.js"></script>
  
  <script src="js/warden.js"></script>
  <script src="js/complaints.js"></script>

  <script>
    function closeModal(id) {
      document.getElementById(id).classList.remove('show');
    }

    document.getElementById('update-complaint-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const complaintId = document.getElementById('complaint-id').value;
      const status = document.getElementById('complaint-status-select').value;
      const remarks = document.getElementById('complaint-remarks-input').value.trim();

      const btn = document.getElementById('save-complaint-btn');
      btn.disabled = true;

      try {
        const res = await api.patch(`/warden/complaints/${complaintId}/status`, { status, remarks });
        if (res.success) {
          toast.success('Complaint status updated successfully!');
          closeModal('update-complaint-modal');
          await loadWardenComplaints();
        } else {
          toast.error(res.message || 'Failed to update complaint status.');
        }
      } catch (err) {
        toast.error(err.message || 'Error updating complaint.');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
