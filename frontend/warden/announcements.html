<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Announcements Management - HMS</title>
  <link rel="stylesheet" href="../assets/css/hms-layout.css">
  <link rel="stylesheet" href="css/warden.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body data-page-title="Announcements">

  <div class="app-layout">
    <aside id="app-sidebar" class="sidebar"></aside>

    <div class="main-wrapper">
      <header id="app-topbar" class="topbar"></header>

      <main class="content-body">
        <div class="page-header" style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h1>Announcements Management</h1>
            <p>Publish and manage hostel notices for students.</p>
          </div>

          <button class="btn btn-primary" id="open-add-ann-btn">
            <i data-lucide="plus"></i> Publish New Announcement
          </button>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title"><i data-lucide="megaphone"></i> Broadcasted Announcements</div>
          </div>

          <div id="announcements-container">
            <div class="loading-spinner">
              <p>Loading announcements...</p>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Create / Edit Announcement Modal -->
  <div id="announcement-modal" class="modal-backdrop">
    <div class="modal-content" style="max-width: 550px;">
      <div class="modal-header">
        <div class="modal-title" id="ann-modal-title">Publish Announcement</div>
        <button class="modal-close" onclick="closeModal('announcement-modal')">&times;</button>
      </div>
      <form id="announcement-form" novalidate>
        <input type="hidden" id="ann-id" />
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="ann-title">Title *</label>
            <input type="text" id="ann-title" class="form-control" placeholder="Notice headline" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="ann-description">Description / Content *</label>
            <textarea id="ann-description" class="form-control" rows="4" placeholder="Detailed message..." required></textarea>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="ann-priority">Priority *</label>
              <select id="ann-priority" class="form-control" required>
                <option value="Normal">Normal</option>
                <option value="Important">Important</option>
                <option value="Urgent">Urgent</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="ann-expiryDate">Expiry Date (Optional)</label>
              <input type="date" id="ann-expiryDate" class="form-control" />
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('announcement-modal')">Cancel</button>
          <button type="submit" id="save-ann-btn" class="btn btn-primary"><span>Publish</span></button>
        </div>
      </form>
    </div>
  </div>

  <script src="../assets/js/modules/api.js"></script>
  <script src="../assets/js/modules/auth.js"></script>
  <script src="../assets/js/modules/sidebar.js"></script>
  <script src="../assets/js/modules/toast.js"></script>
  <script src="../assets/js/modules/validator.js"></script>
  
  <script src="js/warden.js"></script>
  <script src="js/announcements.js"></script>

  <script>
    function closeModal(id) {
      document.getElementById(id).classList.remove('show');
    }

    document.getElementById('open-add-ann-btn').addEventListener('click', () => {
      document.getElementById('ann-id').value = '';
      document.getElementById('announcement-form').reset();
      document.getElementById('ann-modal-title').textContent = 'Publish Announcement';
      document.getElementById('announcement-modal').classList.add('show');
    });
  </script>
</body>
</html>
