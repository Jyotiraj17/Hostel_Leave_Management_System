<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - HMS Hostel Management System</title>
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-page">

  <div class="auth-card-single">
    <div class="auth-header">
      <h1>Forgot Password</h1>
      <p>Enter your registered Gmail address to receive a password reset link.</p>
    </div>

    <div id="alert-error" class="alert alert-error"></div>
    <div id="alert-success" class="alert alert-success"></div>

    <form id="forgot-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email / Gmail</label>
        <div class="input-wrapper">
          <input 
            type="email" 
            id="email" 
            class="form-input" 
            placeholder="e.g. user@gmail.com" 
            required 
            autocomplete="email"
          >
        </div>
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary btn-full">
        <span>Send Reset Link</span>
      </button>
    </form>

    <div class="auth-footer-text">
      <a href="login.html" style="display: inline-flex; align-items: center; gap: 0.35rem;">
        <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i>
        <span>Back to Login</span>
      </a>
    </div>
  </div>

  <script src="../assets/js/modules/api.js"></script>
  <script src="../assets/js/modules/toast.js"></script>
  <script src="../assets/js/modules/validator.js"></script>

  <script>
    lucide.createIcons();

    const forgotForm = document.getElementById('forgot-form');
    const emailInput = document.getElementById('email');
    const submitBtn = document.getElementById('submit-btn');
    const alertError = document.getElementById('alert-error');
    const alertSuccess = document.getElementById('alert-success');

    forgotForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertError.classList.remove('alert-visible');
      alertSuccess.classList.remove('alert-visible');

      const email = emailInput.value.trim();

      if (!validator.isNotEmpty(email)) {
        showError('Please enter your registered email address.');
        emailInput.focus();
        return;
      }

      if (!validator.isValidEmail(email)) {
        showError('Please enter a valid email address.');
        emailInput.focus();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.querySelector('span').textContent = 'Sending Link...';

      try {
        const response = await api.post('/auth/forgot-password', { email });
        
        if (response.success) {
          showSuccess(response.message || 'Password reset link sent to your registered Gmail.');
          emailInput.value = '';
        } else {
          showError(response.message || 'Failed to send reset link.');
        }
      } catch (err) {
        showError(err.message || 'Error connecting to server. Please try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.querySelector('span').textContent = 'Send Reset Link';
      }
    });

    function showError(msg) {
      alertError.textContent = msg;
      alertError.classList.add('alert-visible');
    }

    function showSuccess(msg) {
      alertSuccess.textContent = msg;
      alertSuccess.classList.add('alert-visible');
    }
  </script>
</body>
</html>
