<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - HMS Hostel Management System</title>
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-page">

  <div class="auth-card-single">
    <div class="auth-header">
      <h1>Set New Password</h1>
      <p>Enter your new password below to reset your account credentials.</p>
    </div>

    <div id="alert-error" class="alert alert-error"></div>
    <div id="alert-success" class="alert alert-success"></div>

    <form id="reset-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="password">New Password</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="Enter new password (min. 6 chars)" 
            required
          >
          <button type="button" class="toggle-password" id="toggle-p1">
            <i data-lucide="eye"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm-password">Confirm New Password</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="confirm-password" 
            class="form-input" 
            placeholder="Confirm new password" 
            required
          >
          <button type="button" class="toggle-password" id="toggle-p2">
            <i data-lucide="eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary btn-full">
        <span>Reset Password</span>
      </button>
    </form>

    <div class="auth-footer-text">
      <a href="login.html" style="display: inline-flex; align-items: center; gap: 0.35rem;">
        <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i>
        <span>Back to Login</span>
      </a>
    </div>
  </div>

  <script src="../assets/js/modules/api.js"></script>
  <script src="../assets/js/modules/toast.js"></script>
  <script src="../assets/js/modules/validator.js"></script>

  <script>
    lucide.createIcons();

    // Extract token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const resetToken = urlParams.get('token');

    const resetForm = document.getElementById('reset-form');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirm-password');
    const submitBtn = document.getElementById('submit-btn');
    const alertError = document.getElementById('alert-error');
    const alertSuccess = document.getElementById('alert-success');

    if (!resetToken) {
      showError('Invalid or missing password reset token. Please request a new link.');
      submitBtn.disabled = true;
    }

    // Toggle Password Visibility
    const setupToggle = (btnId, inputEl) => {
      document.getElementById(btnId).addEventListener('click', () => {
        const type = inputEl.getAttribute('type') === 'password' ? 'text' : 'password';
        inputEl.setAttribute('type', type);
        const icon = document.getElementById(btnId).querySelector('i');
        icon.setAttribute('data-lucide', type === 'text' ? 'eye-off' : 'eye');
        lucide.createIcons();
      });
    };

    setupToggle('toggle-p1', passwordInput);
    setupToggle('toggle-p2', confirmPasswordInput);

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertError.classList.remove('alert-visible');
      alertSuccess.classList.remove('alert-visible');

      const password = passwordInput.value.trim();
      const confirmPassword = confirmPasswordInput.value.trim();

      if (!validator.isMinLength(password, 6)) {
        showError('New password must be at least 6 characters long.');
        passwordInput.focus();
        return;
      }

      if (!validator.doMatch(password, confirmPassword)) {
        showError('New password and confirmation password do not match.');
        confirmPasswordInput.focus();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.querySelector('span').textContent = 'Updating Password...';

      try {
        const response = await api.post(`/auth/reset-password/${resetToken}`, { password });
        
        if (response.success) {
          showSuccess(response.message || 'Password reset successfully! Redirecting to login...');
          resetForm.reset();
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        } else {
          showError(response.message || 'Failed to reset password.');
        }
      } catch (err) {
        showError(err.message || 'Error connecting to server.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.querySelector('span').textContent = 'Reset Password';
      }
    });

    function showError(msg) {
      alertError.textContent = msg;
      alertError.classList.add('alert-visible');
    }

    function showSuccess(msg) {
      alertSuccess.textContent = msg;
      alertSuccess.classList.add('alert-visible');
    }
  </script>
</body>
</html>
