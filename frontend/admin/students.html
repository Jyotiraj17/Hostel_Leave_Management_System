<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management - HMS</title>
  <link rel="stylesheet" href="../assets/css/hms-layout.css">
  <link rel="stylesheet" href="css/admin.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body data-page-title="Students">

  <div class="app-layout">
    <aside id="app-sidebar" class="sidebar"></aside>

    <div class="main-wrapper">
      <header id="app-topbar" class="topbar"></header>

      <main class="content-body">
        <div class="page-header" style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h1>Student Management</h1>
            <p>Administer student registrations, assignments, and account status.</p>
          </div>
          <button class="btn btn-primary" id="open-add-student-btn">
            <i data-lucide="plus"></i> Add New Student
          </button>
        </div>

        <div class="card">
          <div class="card-header" style="flex-wrap: wrap; gap: 1rem;">
            <div style="display: flex; align-items: center; gap: 0.75rem; flex: 1; min-width: 250px;">
              <input type="text" id="student-search" class="form-control" placeholder="Search by name, roll number, or email..." />
            </div>

            <div style="display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;">
              <select id="dept-filter" class="form-control" style="width: auto;">
                <option value="">All Departments</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Electronics">Electronics</option>
                <option value="Mechanical">Mechanical</option>
                <option value="Civil">Civil</option>
              </select>

              <select id="status-filter" class="form-control" style="width: auto;">
                <option value="">All Statuses</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
            </div>
          </div>

          <div id="students-container">
            <div class="loading-spinner">
              <p>Loading student records...</p>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- View Student Modal -->
  <div id="view-student-modal" class="modal-backdrop">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Student Profile Information</div>
        <button class="modal-close" onclick="closeModal('view-student-modal')">&times;</button>
      </div>
      <div class="modal-body" id="view-modal-body"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('view-student-modal')">Close</button>
      </div>
    </div>
  </div>

  <!-- Add Student Modal -->
  <div id="add-student-modal" class="modal-backdrop">
    <div class="modal-content" style="max-width: 700px;">
      <div class="modal-header">
        <div class="modal-title">Add New Student</div>
        <button class="modal-close" onclick="closeModal('add-student-modal')">&times;</button>
      </div>
      <form id="add-student-form" novalidate>
        <div class="modal-body">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="add-fullName">Full Name *</label>
              <input type="text" id="add-fullName" class="form-control" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="add-rollNo">Roll Number *</label>
              <input type="text" id="add-rollNo" class="form-control" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="add-email">Email / Gmail *</label>
              <input type="email" id="add-email" class="form-control" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="add-phone">Phone Number *</label>
              <input type="text" id="add-phone" class="form-control" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="add-department">Department *</label>
              <input type="text" id="add-department" class="form-control" placeholder="e.g. Computer Science" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="add-year">Year *</label>
              <select id="add-year" class="form-control" required>
                <option value="">Select Year</option>
                <option value="1st Year">1st Year</option>
                <option value="2nd Year">2nd Year</option>
                <option value="3rd Year">3rd Year</option>
                <option value="4th Year">4th Year</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="add-gender">Gender *</label>
              <select id="add-gender" class="form-control" required>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="add-hostel">Hostel Name</label>
              <input type="text" id="add-hostel" class="form-control" placeholder="e.g. Boys Hostel A" />
            </div>

            <div class="form-group">
              <label class="form-label" for="add-block">Block</label>
              <input type="text" id="add-block" class="form-control" placeholder="e.g. Block A" />
            </div>

            <div class="form-group">
              <label class="form-label" for="add-guardianName">Guardian Name</label>
              <input type="text" id="add-guardianName" class="form-control" />
            </div>

            <div class="form-group">
              <label class="form-label" for="add-guardianPhone">Guardian Phone</label>
              <input type="text" id="add-guardianPhone" class="form-control" />
            </div>

            <div class="form-group" style="grid-column: 1 / -1;">
              <label class="form-label" for="add-address">Address</label>
              <textarea id="add-address" class="form-control" rows="2"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('add-student-modal')">Cancel</button>
          <button type="submit" id="save-new-student-btn" class="btn btn-primary">Add Student</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Student Modal -->
  <div id="edit-student-modal" class="modal-backdrop">
    <div class="modal-content" style="max-width: 700px;">
      <div class="modal-header">
        <div class="modal-title">Edit Student Information</div>
        <button class="modal-close" onclick="closeModal('edit-student-modal')">&times;</button>
      </div>
      <form id="edit-student-form" novalidate>
        <input type="hidden" id="edit-student-id" />
        <div class="modal-body">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="edit-fullName">Full Name</label>
              <input type="text" id="edit-fullName" class="form-control" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="edit-phone">Phone Number</label>
              <input type="text" id="edit-phone" class="form-control" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="edit-department">Department</label>
              <input type="text" id="edit-department" class="form-control" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="edit-year">Year</label>
              <input type="text" id="edit-year" class="form-control" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="edit-gender">Gender</label>
              <select id="edit-gender" class="form-control">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="edit-status">Account Status</label>
              <select id="edit-status" class="form-control">
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="edit-hostel">Hostel</label>
              <input type="text" id="edit-hostel" class="form-control" />
            </div>

            <div class="form-group">
              <label class="form-label" for="edit-block">Block</label>
              <input type="text" id="edit-block" class="form-control" />
            </div>

            <div class="form-group">
              <label class="form-label" for="edit-guardianName">Guardian Name</label>
              <input type="text" id="edit-guardianName" class="form-control" />
            </div>

            <div class="form-group">
              <label class="form-label" for="edit-guardianPhone">Guardian Phone</label>
              <input type="text" id="edit-guardianPhone" class="form-control" />
            </div>

            <div class="form-group" style="grid-column: 1 / -1;">
              <label class="form-label" for="edit-address">Address</label>
              <textarea id="edit-address" class="form-control" rows="2"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('edit-student-modal')">Cancel</button>
          <button type="submit" id="update-student-btn" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../assets/js/modules/api.js"></script>
  <script src="../assets/js/modules/auth.js"></script>
  <script src="../assets/js/modules/sidebar.js"></script>
  <script src="../assets/js/modules/toast.js"></script>
  <script src="../assets/js/modules/validator.js"></script>
  
  <script src="js/admin.js"></script>
  <script src="js/students.js"></script>

  <script>
    function closeModal(id) {
      document.getElementById(id).classList.remove('show');
    }

    document.getElementById('open-add-student-btn').addEventListener('click', () => {
      document.getElementById('add-student-modal').classList.add('show');
    });

    // Add Student Form Handler
    document.getElementById('add-student-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fullName = document.getElementById('add-fullName').value.trim();
      const rollNo = document.getElementById('add-rollNo').value.trim();
      const email = document.getElementById('add-email').value.trim();
      const phone = document.getElementById('add-phone').value.trim();
      const department = document.getElementById('add-department').value.trim();
      const year = document.getElementById('add-year').value;
      const gender = document.getElementById('add-gender').value;
      const hostel = document.getElementById('add-hostel').value.trim();
      const block = document.getElementById('add-block').value.trim();
      const guardianName = document.getElementById('add-guardianName').value.trim();
      const guardianPhone = document.getElementById('add-guardianPhone').value.trim();
      const address = document.getElementById('add-address').value.trim();

      if (!fullName || !rollNo || !email || !phone || !department || !year) {
        toast.error('Please fill in all required fields.');
        return;
      }

      const saveBtn = document.getElementById('save-new-student-btn');
      saveBtn.disabled = true;

      try {
        const res = await api.post('/admin/students', {
          fullName, rollNo, email, phone, department, year, gender, hostel, block, guardianName, guardianPhone, address
        });

        if (res.success) {
          toast.success('Student added successfully!');
          closeModal('add-student-modal');
          document.getElementById('add-student-form').reset();
          await loadStudentsList();
        } else {
          toast.error(res.message || 'Failed to add student.');
        }
      } catch (err) {
        toast.error(err.message || 'Error adding student.');
      } finally {
        saveBtn.disabled = false;
      }
    });

    // Edit Student Form Handler
    document.getElementById('edit-student-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const studentId = document.getElementById('edit-student-id').value;
      const fullName = document.getElementById('edit-fullName').value.trim();
      const phone = document.getElementById('edit-phone').value.trim();
      const department = document.getElementById('edit-department').value.trim();
      const year = document.getElementById('edit-year').value.trim();
      const gender = document.getElementById('edit-gender').value;
      const status = document.getElementById('edit-status').value;
      const hostel = document.getElementById('edit-hostel').value.trim();
      const block = document.getElementById('edit-block').value.trim();
      const guardianName = document.getElementById('edit-guardianName').value.trim();
      const guardianPhone = document.getElementById('edit-guardianPhone').value.trim();
      const address = document.getElementById('edit-address').value.trim();

      const updateBtn = document.getElementById('update-student-btn');
      updateBtn.disabled = true;

      try {
        const res = await api.put(`/admin/students/${studentId}`, {
          fullName, phone, department, year, gender, status, hostel, block, guardianName, guardianPhone, address
        });

        if (res.success) {
          toast.success('Student information updated.');
          closeModal('edit-student-modal');
          await loadStudentsList();
        } else {
          toast.error(res.message || 'Failed to update student.');
        }
      } catch (err) {
        toast.error(err.message || 'Error updating student.');
      } finally {
        updateBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
