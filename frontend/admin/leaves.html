<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave Records - HMS</title>
  <link rel="stylesheet" href="../assets/css/hms-layout.css">
  <link rel="stylesheet" href="css/admin.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body data-page-title="Leave Records">

  <div class="app-layout">
    <aside id="app-sidebar" class="sidebar"></aside>

    <div class="main-wrapper">
      <header id="app-topbar" class="topbar"></header>

      <main class="content-body">
        <div class="page-header" style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h1>Leave Records</h1>
            <p>System-wide view of all student leave applications.</p>
          </div>

          <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
            <button class="btn btn-primary btn-sm leave-filter-btn" data-status="ALL">All</button>
            <button class="btn btn-secondary btn-sm leave-filter-btn" data-status="PENDING">Pending</button>
            <button class="btn btn-secondary btn-sm leave-filter-btn" data-status="APPROVED">Approved</button>
            <button class="btn btn-secondary btn-sm leave-filter-btn" data-status="REJECTED">Rejected</button>
            <button class="btn btn-secondary btn-sm leave-filter-btn" data-status="CANCELLED">Cancelled</button>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title"><i data-lucide="calendar"></i> Student Leave Applications</div>
          </div>

          <div id="leaves-container">
            <div class="loading-spinner">
              <p>Loading leave records...</p>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- View Leave Modal -->
  <div id="leave-view-modal" class="modal-backdrop">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Leave Record Details</div>
        <button class="modal-close" onclick="closeModal('leave-view-modal')">&times;</button>
      </div>
      <div class="modal-body" id="leave-view-body"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('leave-view-modal')">Close</button>
      </div>
    </div>
  </div>

  <script src="../assets/js/modules/api.js"></script>
  <script src="../assets/js/modules/auth.js"></script>
  <script src="../assets/js/modules/sidebar.js"></script>
  <script src="../assets/js/modules/toast.js"></script>
  <script src="../assets/js/modules/validator.js"></script>
  
  <script src="js/admin.js"></script>
  <script src="js/leaves.js"></script>

  <script>
    function closeModal(id) {
      document.getElementById(id).classList.remove('show');
    }
  </script>
</body>
</html>
