<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password - HMS</title>
  <link rel="stylesheet" href="../assets/css/hms-layout.css">
  <link rel="stylesheet" href="css/admin.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body data-page-title="Change Password">

  <div class="app-layout">
    <aside id="app-sidebar" class="sidebar"></aside>

    <div class="main-wrapper">
      <header id="app-topbar" class="topbar"></header>

      <main class="content-body">
        <div class="page-header">
          <h1>Change Password</h1>
          <p>Update your system administrator password.</p>
        </div>

        <div class="card" style="max-width: 500px;">
          <div class="card-header">
            <div class="card-title"><i data-lucide="key"></i> Update Password</div>
          </div>

          <form id="change-password-form" novalidate>
            <div class="form-group">
              <label class="form-label" for="currentPassword">Current Password *</label>
              <input type="password" id="currentPassword" class="form-control" placeholder="Enter current password" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="newPassword">New Password *</label>
              <input type="password" id="newPassword" class="form-control" placeholder="Enter new password (min. 6 characters)" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="confirmPassword">Confirm New Password *</label>
              <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm new password" required />
            </div>

            <div style="margin-top: 1.5rem; text-align: right;">
              <button type="submit" id="change-pass-btn" class="btn btn-primary">
                <i data-lucide="save"></i>
                <span>Update Password</span>
              </button>
            </div>
          </form>
        </div>

      </main>
    </div>
  </div>

  <script src="../assets/js/modules/api.js"></script>
  <script src="../assets/js/modules/auth.js"></script>
  <script src="../assets/js/modules/sidebar.js"></script>
  <script src="../assets/js/modules/toast.js"></script>
  <script src="../assets/js/modules/validator.js"></script>
  
  <script src="js/admin.js"></script>
  <script src="js/change-password.js"></script>
</body>
</html>
